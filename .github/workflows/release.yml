#
# Build one platform-specific VSIX per target and upload them as workflow
# artifacts. This workflow deliberately does NOT publish to the Marketplace:
# the maintainer downloads the artifacts and publishes them manually.
#
# WHY PER-PLATFORM AT ALL
# ----------------------
# The extension's database engine is the NATIVE `better-sqlite3` (stock SQLite),
# which compiles or loads a platform-specific binary.
#
# UNLIKE the engine this replaced, `better-sqlite3` ships EVERY platform's
# prebuilt binary inside the ONE package, under `prebuilds/<platform>-<arch>.node`
# (win32-x64, win32-arm64, darwin-x64, darwin-arm64, linux-x64, linux-arm64,
# linuxmusl-x64, linuxmusl-arm64). There are no per-platform optional
# dependencies such as `@tursodatabase/database-<platform>`, and no npm
# cross-install variables are involved: `lib/binding.js` resolves the right
# binary from `process.platform` / `process.arch` at require time, with musl
# detected separately on Linux. So the installed node_modules is identical on
# every platform and a SINGLE untargeted VSIX would run anywhere.
#
# The per-target split is therefore no longer a packaging necessity — it is kept
# so each published artifact advertises its platform and users get the right one
# without the Marketplace guessing. VS Code stores one VSIX per target under the
# same version, and each user's VS Code downloads the one matching their OS/arch.
# `npm run package` also produces a single untargeted VSIX that works everywhere.
#
# (A WASM client would avoid all of this, but the previously evaluated
# `@libsql/client-wasm` cannot open a database file — an absolute path fails
# with SQLITE_CANTOPEN and a relative one silently becomes an in-memory DB — so
# it is not an option.)
#
# The target list is the extension's own advertised platform set. `better-sqlite3`
# ships binaries for two of the excluded platforms as well (darwin-x64 and the
# musl builds), so their exclusion is a product decision — the extension has
# never advertised them and they are untested — NOT a missing binary.
#
# DELIBERATELY UNSUPPORTED — do not add these to the matrix:
#   - darwin-x64    (macOS on Intel)
#   - musl/Alpine   (`linuxmusl-x64`, `linuxmusl-arm64`)
#   - win32-arm64   (Windows on ARM)
# If the extension ever starts advertising one of them, add it here too.
name: Build platform VSIXs

# MANUAL ONLY. There is deliberately no `push` or `pull_request` trigger: this
# workflow builds release artifacts, so it must never run on its own. Start it
# from the Actions tab ("Run workflow") when you actually want the VSIXs.
#
# There are no inputs: the version is always read from `package.json`, so the
# artifacts can never disagree with the manifest that was packaged. Bump the
# manifest before dispatching.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fail fast, once, on a normal runner: lint, typecheck, tests and the repo's
  # own quality gates. The per-platform jobs below only build and package, so a
  # broken commit does not produce a dozen equally-broken artifacts.
  verify:
    name: Verify sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 is required by the build toolchain, not by the extension:
          # `@vscode/vsce` 4 declares `engines: { node: ">= 22" }` and pulls in
          # `@azure/identity` 4, whose transitive packages also need 22. The VS
          # Code extension host itself is unaffected — it never loads any of
          # these, they are packaging-time-only dependencies.
          node-version: '22'
          cache: npm

      # The native runtime is not needed to typecheck or run the unit tests,
      # but `npm ci` must succeed on a supported platform.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node ./node_modules/typescript/bin/tsc -p tsconfig.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Quality gates (dead code, duplication, message router)
        run: |
          npm run verify:deadcode
          npm run verify:duplication
          npm run verify:router

  package:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform must not hide the others' results.
      fail-fast: false
      matrix:
        include:
          # --- Windows -------------------------------------------------------
          - os: windows-latest
            target: win32-x64
            vsce_target: win32-x64
          # win32-arm64 is NOT built: `better-sqlite3` DOES ship a
          # `prebuilds/win32-arm64` binary, but the extension has never
          # advertised Windows on ARM and does not test it.
          # --- macOS: runner arch decides the binary -------------------------
          # Only the Apple-silicon build is advertised. `prebuilds/darwin-x64`
          # DOES exist, but macOS Intel has never been advertised or tested.
          - os: macos-latest
            target: darwin-arm64
            vsce_target: darwin-arm64
          # --- Linux (glibc) -------------------------------------------------
          - os: ubuntu-latest
            target: linux-x64
            vsce_target: linux-x64
          # A NATIVE arm64 runner, so node-gyp never has to cross-compile:
          # `npm ci` on this runner resolves its own prebuild from the host.
          - os: ubuntu-24.04-arm
            target: linux-arm64
            vsce_target: linux-arm64
          # Alpine (musl) is NOT built: `prebuilds/linuxmusl-*` DOES exist, but
          # the extension has never advertised musl and does not test it.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the `verify` job and satisfy `@vscode/vsce`'s
          # `engines: { node: ">= 22" }`, which the packaging step runs.
          node-version: '22'
          # Caches only the npm DOWNLOAD cache (~/.npm), which is platform
          # independent. The installed node_modules is NOT cached, so each matrix
          # entry installs the dependency tree fresh.
          cache: npm

      # Install the dependency tree.
      #
      # `better-sqlite3` carries every platform's prebuilt binary in the one
      # package, so nothing target-specific is installed here: each runner
      # installs the same tree, and the binary that is actually loaded is picked
      # from `prebuilds/` at require time. There are no per-platform optional
      # dependencies to fetch and no cross-install variables to set.
      #
      # These variables are deliberately NOT set. They used to be wired to
      # `${{ matrix.npm_config_arch }}` and friends, but those matrix fields do
      # not exist, so Actions rendered them as EMPTY STRINGS. An empty
      # `npm_config_arch` is worse than an unset one: `@vscode/vsce-sign`'s
      # postinstall resolves its native binary with
      # `process.env['npm_config_arch'] ?? process.arch`, and `??` does not fall
      # back for `''` — so it looked up the target for architecture `''`, found
      # nothing, and failed the install with
      # "The current platform (linux) and architecture () is not supported."
      # Leaving them unset lets npm fall back to the host's own
      # process.platform / process.arch, which is exactly what is wanted here.
      #
      # `npm ci` is used (not `npm install`) so the lockfile is authoritative.
      - name: Install dependencies for ${{ matrix.target }}
        run: |
          npm ci
          node -e "console.log('installed for', process.platform, process.arch)"

      # The smoke test loads the COMPILED adapter (it exercises the real code path
      # rather than the TypeScript source), so the extension must be built first.
      # `npm ci` only installs dependencies and produces no `out/`, which is why
      # this step exists — without it every platform fails with
      # "Compiled adapter not found in out/extension/adapter/".
      #
      # Only the extension is compiled here; the webview bundle is built later by
      # the packaging step, which needs it anyway.
      - name: Compile the extension
        run: npm run compile:extension

      # Prove the binary that will be shipped actually loads and can open a
      # database. A packaging mistake that drops the native module is otherwise
      # only discovered by users at runtime.
      #
      # No npm_config_* env here either: the runner's own platform IS the target,
      # so `smoke-native.js` resolving via the host is correct. Passing empty
      # strings would make the script consult `''` instead of the real host.
      - name: Smoke-test the native engine
        run: node scripts/smoke-native.js

      - name: Package targeted VSIX (${{ matrix.vsce_target }})
        shell: bash
        run: |
          npm run compile
          # Same output layout as `npm run package:target`: VSIX/<version>/.
          # Read the version from package.json so this can never drift from the
          # manifest that vsce actually packaged.
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p "VSIX/$VERSION"
          # NOTE: do NOT pass --no-dependencies. That flag stops vsce from
          # walking the dependency tree, so `node_modules/better-sqlite3/**`
          # never reaches the archive and the installed extension cannot load
          # its engine at all. `.vscodeignore` is what controls the contents.
          node node_modules/@vscode/vsce/vsce package \
            --target "${{ matrix.vsce_target }}" \
            -o "VSIX/$VERSION/sqlite-libsql-preview-edit-${{ matrix.vsce_target }}.vsix"

      - name: Show what was packaged
        shell: bash
        run: ls -la VSIX/*/

      - name: Verify the VSIX carries the native runtime
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/verify-vsix.js "VSIX/$VERSION/sqlite-libsql-preview-edit-${{ matrix.vsce_target }}.vsix"

      # Plain `actions/upload-artifact`, one artifact per target, so the
      # maintainer can download exactly the platform(s) they need.
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: VSIX/*/*.vsix
          if-no-files-found: error
          retention-days: 30
