#
# Build one platform-specific VSIX per target and upload them as workflow
# artifacts. This workflow deliberately does NOT publish to the Marketplace:
# the maintainer downloads the artifacts and publishes them manually.
#
# WHY PER-PLATFORM AT ALL
# ----------------------
# The extension's database engine is the NATIVE `libsql` npm package (the libSQL
# C fork), which loads a platform-specific binary shipped as ONE optional
# dependency package per platform: `@libsql/<target>/index.node` (targets:
# darwin-arm64, darwin-x64, win32-x64-msvc, linux-{x64,arm64}-gnu,
# linux-{x64,arm64}-musl, linux-arm-{gnueabihf,musleabihf}).
#
# npm installs every optionalDependency whose `os`/`cpu` match the HOST. On
# Windows and macOS that is exactly one binary per runner — but on Linux BOTH
# `@libsql/linux-<arch>-gnu` AND `-musl` match (their manifests differ only in
# nothing npm checks; the glibc-vs-musl choice is made by the loader at require
# time via `detect-libc`). So a Linux runner installs two binaries, and a plain
# `vsce package` would ship both. Packaging therefore goes through
# `scripts/package-target.js`, which prunes `node_modules/@libsql` down to the
# one binary the target's VSIX may carry before invoking vsce (measured on
# vsce 4.x: `--target` alone does NOT prune optionalDependencies).
#
# On Linux the loader remaps musl→gnu (`node_modules/libsql/index.js`), so the
# gnu binary alone also serves Alpine/musl users.
#
# DELIBERATELY UNSUPPORTED — do not add these to the matrix:
#   - darwin-x64    (macOS on Intel): libsql DOES ship `@libsql/darwin-x64`, but
#     the extension does not advertise or test it. Intel-Mac users can package
#     the VSIX themselves — see SUPPORT.md for the step-by-step tutorial.
#   - win32-arm64   (Windows on ARM): no libsql binary exists for this target.
#   - linux musl-specific binaries: served by the gnu builds via the loader's
#     remap, so a separate matrix entry would change nothing.
name: Build platform VSIXs

# MANUAL ONLY. There is deliberately no `push` or `pull_request` trigger: this
# workflow builds release artifacts, so it must never run on its own. Start it
# from the Actions tab ("Run workflow") when you actually want the VSIXs.
#
# There are no inputs: the version is always read from `package.json`, so the
# artifacts can never disagree with the manifest that was packaged. Bump the
# manifest before dispatching.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fail fast, once, on a normal runner: lint, typecheck, tests and the repo's
  # own quality gates. The per-platform jobs below only build and package, so a
  # broken commit does not produce a dozen equally-broken artifacts.
  verify:
    name: Verify sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, deliberately above the minimum the build toolchain allows.
          # The extension itself has no node-gyp step anymore (libsql ships
          # prebuilt binaries), but `@vscode/vsce` 4 declares
          # `engines: { node: ">= 22" }` and the tooling is exercised on the
          # same Node everywhere, so one modern version is pinned here.
          node-version: '24'
          cache: npm

      # The native runtime is not needed to typecheck or run the unit tests,
      # but `npm ci` must succeed on a supported platform.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node ./node_modules/typescript/bin/tsc -p tsconfig.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Quality gates (dead code, duplication, message router)
        run: |
          npm run verify:deadcode
          npm run verify:duplication
          npm run verify:router

  package:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform must not hide the others' results.
      fail-fast: false
      matrix:
        include:
          # --- Windows -------------------------------------------------------
          - os: windows-latest
            target: win32-x64
          # win32-arm64 is NOT built: libsql publishes no binary for it.
          # --- macOS: Apple Silicon ------------------------------------------
          # Only the Apple-silicon build is advertised. `@libsql/darwin-x64`
          # DOES exist upstream, but macOS Intel has never been advertised or
          # tested; see SUPPORT.md for the self-packaging tutorial instead.
          - os: macos-latest
            target: darwin-arm64
          # --- Linux (glibc) -------------------------------------------------
          # `target` is both the vsce --target value and the key into
          # `package-target.js`'s TARGET_BINARY_PACKAGE map (@libsql/linux-x64-gnu).
          - os: ubuntu-latest
            target: linux-x64
          # A NATIVE arm64 runner, so nothing has to cross-compile: `npm ci` on
          # this runner resolves its own `@libsql/linux-arm64-gnu` binary from
          # the host.
          - os: ubuntu-24.04-arm
            target: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the `verify` job.
          node-version: '24'
          # Caches only the npm DOWNLOAD cache (~/.npm), which is platform
          # independent. The installed node_modules is NOT cached, so each matrix
          # entry installs the dependency tree fresh.
          cache: npm

      # Install the dependency tree.
      #
      # libsql ships one binary package per platform as optionalDependencies, so
      # npm installs every one whose os/cpu match this runner. On Windows and
      # macOS that is exactly one binary; on Linux it is BOTH the -gnu and -musl
      # package (see the header) — `package-target.js` prunes the extra one
      # before packaging. No cross-install variables are involved.
      #
      # These npm_config_* variables are deliberately NOT set. They used to be
      # wired to `${{ matrix.npm_config_arch }}` and friends, but those matrix
      # fields do not exist, so Actions rendered them as EMPTY STRINGS. An empty
      # `npm_config_arch` is worse than an unset one: `@vscode/vsce-sign`'s
      # postinstall resolves its native binary with
      # `process.env['npm_config_arch'] ?? process.arch`, and `??` does not fall
      # back for `''` — so it looked up the target for architecture `''`, found
      # nothing, and failed the install with
      # "The current platform (linux) and architecture () is not supported."
      # Leaving them unset lets npm fall back to the host's own
      # process.platform / process.arch, which is exactly what is wanted here.
      #
      # `npm ci` is used (not `npm install`) so the lockfile is authoritative.
      #
      # The echo comes FIRST on purpose. On Windows the default shell is pwsh,
      # which does not stop on a failing native command: the step exits with
      # `$LASTEXITCODE`, the status of the LAST native command only. With the
      # echo last, a failing `npm ci` was masked by the succeeding `node -e` and
      # the step reported success, so the failure only surfaced one step later as
      # a confusing "Cannot find module .../typescript/bin/tsc".
      - name: Install dependencies for ${{ matrix.target }}
        run: |
          node -e "console.log('installing for', process.platform, process.arch)"
          npm ci

      # Fail BEFORE packaging if this runner did not get its engine binary:
      # that would mean the lockfile or npm lost the optional dependency, and
      # the VSIX would ship an engine that cannot load.
      - name: Check the engine binary is installed
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const { currentTarget } = require('@neon-rs/load');
            const t = currentTarget();
            const p = 'node_modules/@libsql/' + t + '/index.node';
            if (!fs.existsSync(p)) {
              console.error('engine binary missing for target ' + t + ' (expected ' + p + ')');
              process.exit(1);
            }
            console.log('engine binary present: ' + p);
          "

      # The smoke test loads the COMPILED adapter (it exercises the real code path
      # rather than the TypeScript source), so the extension must be built first.
      # `npm ci` only installs dependencies and produces no `out/`, which is why
      # this step exists — without it every platform fails with
      # "Compiled adapter not found in out/extension/adapter/".
      #
      # Only the extension is compiled here; the webview bundle is built later by
      # the packaging step, which needs it anyway.
      - name: Compile the extension
        run: npm run compile:extension

      # Prove the binary that will be shipped actually loads and can open a
      # database. A packaging mistake that drops the native module is otherwise
      # only discovered by users at runtime.
      #
      # No npm_config_* env here either: the runner's own platform IS the target,
      # so `smoke-native.js` resolving via the host is correct. Passing empty
      # strings would make the script consult `''` instead of the real host.
      - name: Smoke-test the native engine
        run: node scripts/smoke-native.js

      # Package through the SAME script the local flow uses. This matters on
      # Linux: `npm ci` installs both the -gnu and -musl binary there, and a
      # plain `vsce package` would ship both (verify-vsix.js fails with
      # "exactly one @libsql binary must ship"). `package-target.js` stages the
      # sibling binaries out of node_modules for the vsce run and restores them
      # afterwards, so the archive carries exactly the target's binary.
      #
      # Same output layout as `npm run package:target`: VSIX/<version>/.
      - name: Package targeted VSIX (${{ matrix.target }})
        shell: bash
        run: |
          npm run compile
          # Read the version from package.json so this can never drift from the
          # manifest that vsce actually packaged.
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p "VSIX/$VERSION"
          # NOTE: do NOT pass --no-dependencies (the script does not use it
          # either). That flag stops vsce from walking the dependency tree, so
          # `node_modules/libsql/**` never reaches the archive and the installed
          # extension cannot load its engine at all. `.vscodeignore` is what
          # controls the contents.
          node scripts/package-target.js "${{ matrix.target }}"

      - name: Show what was packaged
        shell: bash
        run: ls -la VSIX/*/

      - name: Verify the VSIX carries the native runtime
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          node scripts/verify-vsix.js "VSIX/$VERSION/$NAME-${{ matrix.target }}.vsix"

      # Plain `actions/upload-artifact`, one artifact per target, so the
      # maintainer can download exactly the platform(s) they need.
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: VSIX/*/*.vsix
          if-no-files-found: error
          retention-days: 30
